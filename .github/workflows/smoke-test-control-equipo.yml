name: Smoke test Control Equipo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare premium Horarios integration
        run: python3 scripts/integrate_premium_horarios.py
      - name: Check JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=['index.html','horarios-premium.html'];
          let n=0;
          for(const file of files){
            const html=fs.readFileSync(file,'utf8');
            const matches=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
            if(!matches.length) throw new Error(`No script block found in ${file}`);
            matches.forEach((m,i)=>fs.writeFileSync(`/tmp/control-script-${n++}.js`,m[1]));
            console.log(`${file}: ${matches.length} script block(s)`);
          }
          NODE
          for f in /tmp/control-script-*.js; do node --check "$f"; done
      - name: Verify stable core and premium markers
        run: |
          grep -q "function renderHorarios" index.html
          grep -q "function marcar" index.html
          grep -q "function guardarCfg" index.html
          grep -q "function cargarSolicitudes" index.html
          grep -q "const SB_URL" index.html
          grep -q "QUANTY_PREMIUM_HORARIOS_START" index.html
          grep -q "horarios-premium.html?real=1" index.html
          echo "Stable core preserved and Premium Horarios integrated"
      - name: Verify real Supabase
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const url=(html.match(/const SB_URL='([^']+)'/)||[])[1];
          const key=(html.match(/const SB_KEY='([^']+)'/)||[])[1];
          if(!url||!key) throw new Error('Missing Supabase config');
          const headers={apikey:key,Authorization:`Bearer ${key}`};
          const tests=[
            ['tiendas','tiendas?select=id,nombre&limit=1'],
            ['empleados','empleados?select=id,nombre&limit=1'],
            ['turnos','turnos?select=id,fecha&limit=1']
          ];
          (async()=>{
            for(const [name,path] of tests){
              const r=await fetch(`${url}/rest/v1/${path}`,{headers});
              const text=await r.text();
              console.log(`${name}: HTTP ${r.status}, bytes=${text.length}`);
              if(!r.ok) throw new Error(`${name} HTTP ${r.status}`);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit verified integration
        run: |
          if git diff --quiet -- index.html; then
            echo "Integration already present"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show Premium Horarios inside Control Equipo'
          git push
