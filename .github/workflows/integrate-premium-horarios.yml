name: Integrate Premium Horarios

on: [push]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Control Equipo safely
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start='<!-- QUANTY_PREMIUM_HORARIOS_START -->'
          end='<!-- QUANTY_PREMIUM_HORARIOS_END -->'
          if start in s and end in s:
              a=s.index(start)
              b=s.index(end,a)+len(end)
              s=s[:a]+s[b:]
          patch='''
<!-- QUANTY_PREMIUM_HORARIOS_START -->
<style>
.wrap.horarios-wide{max-width:1280px}.qp-host{margin:0 -2px 18px;border:1px solid #1f3b59;border-radius:18px;overflow:hidden;background:#07111f;box-shadow:0 12px 34px rgba(7,17,31,.12)}.qp-frame{display:block;width:100%;height:980px;border:0;background:#07111f}@media(max-width:760px){.wrap.horarios-wide{max-width:680px}.qp-host{margin-left:-20px;margin-right:-20px;border-radius:0;border-left:0;border-right:0}.qp-frame{height:1050px}}
</style>
<script>
(function(){
  const oldRenderHorarios=window.renderHorarios;
  window.renderHorarios=function(){
    const body=document.getElementById('sBody');
    const wrap=document.querySelector('.wrap');
    if(wrap)wrap.classList.add('horarios-wide');
    if(!body){if(oldRenderHorarios)oldRenderHorarios();return;}
    body.innerHTML='<div class="qp-host"><iframe id="qpHorariosFrame" class="qp-frame" src="horarios-premium.html" title="Horarios del equipo"></iframe></div>';
    const frame=document.getElementById('qpHorariosFrame');
    if(!frame)return;
    frame.addEventListener('load',function(){
      try{
        const d=frame.contentDocument;if(!d)return;
        const top=d.querySelector('.top');if(top)top.style.display='none';
        const foot=d.querySelector('.foot');if(foot)foot.style.display='none';
        const w=d.querySelector('.wrap');if(w){w.style.maxWidth='none';w.style.padding='18px';}
        const resize=function(){try{frame.style.height=Math.max(900,d.documentElement.scrollHeight+24)+'px';}catch(e){}};
        resize();setTimeout(resize,250);setTimeout(resize,900);
        if(window.ResizeObserver)new ResizeObserver(resize).observe(d.body);
      }catch(e){}
    });
  };
  document.querySelectorAll('.stab').forEach(function(t){t.addEventListener('click',function(){const w=document.querySelector('.wrap');if(w&&t.dataset.s!=='horarios')w.classList.remove('horarios-wide');});});
})();
</script>
<!-- QUANTY_PREMIUM_HORARIOS_END -->
'''
          if '</body>' not in s:
              raise SystemExit('No closing body tag; refusing to patch')
          s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax guard
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');const html=fs.readFileSync('index.html','utf8');
          for(const x of ['QUANTY_PREMIUM_HORARIOS_START','function renderHorarios','function marcar','function guardarCfg','function cargarSolicitudes'])if(!html.includes(x))throw new Error('Missing '+x);
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];scripts.forEach((m,i)=>fs.writeFileSync('/tmp/control-'+i+'.js',m[1]));
          NODE
          for f in /tmp/control-*.js; do node --check "$f"; done
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show premium schedules inside Control Equipo'
          git push
