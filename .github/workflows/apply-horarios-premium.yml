name: Apply premium horarios

on:
  push:
    branches:
      - premium-horarios-rollout
    paths:
      - scripts/apply_horarios_premium.py
      - .github/workflows/apply-horarios-premium.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: premium-horarios-rollout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply visual-only horarios patch
        run: python scripts/apply_horarios_premium.py
      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Control Equipo horarios visual only"
          git push origin HEAD:premium-horarios-rollout
